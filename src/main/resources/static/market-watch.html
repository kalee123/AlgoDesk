<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Watch · AlgoDesk</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme.js"></script>
</head>
<body data-page="market-watch">
<header id="app-nav" class="navbar"></header>

<div class="workspace">
    <!-- Left: search + instrument list (like Kite's watchlist) -->
    <aside class="watch-panel">
        <div class="watch-search">
            <input id="search" class="search-input" type="search" autocomplete="off" autofocus
                   placeholder="Search eg: infy bse, nifty fut"
                   aria-label="Search instruments">
        </div>
        <div id="status" class="watch-status">Type at least 2 characters to search</div>
        <ul id="results" class="watch-list" hidden></ul>
    </aside>

    <!-- Right: selected instrument; the chart goes here later -->
    <section class="chart-panel">
        <div id="chart-empty" class="chart-empty">Select an instrument to view its chart</div>
        <div id="chart-view" hidden>
            <div class="chart-header">
                <span id="chart-symbol" class="symbol"></span>
                <span id="chart-exchange" class="tag"></span>
                <span id="chart-name" class="muted"></span>
            </div>
            <div class="chart-toolbar">
                <div id="intervals" class="interval-group" role="group" aria-label="Candle interval"></div>
                <span id="chart-legend" class="chart-legend"></span>
            </div>
            <div class="chart-box">
                <div id="chart"></div>
                <div id="chart-status" class="chart-status" hidden></div>
            </div>
        </div>
    </section>
</div>

<!-- TradingView Lightweight Charts (v4 API: chart.addCandlestickSeries) -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="/js/common.js"></script>
<script src="/js/market-watch.js"></script>
</body>
</html>
