<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backtest · AlgoDesk</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme.js"></script>
</head>
<body data-page="backtest">
<header id="app-nav" class="navbar"></header>

<!-- One centred column with the results of the last run; the setup opens as a modal -->
<main class="bt-page">
    <!-- Setup as a modal (native <dialog>: dimmed backdrop, Esc closes, focus stays inside).
         Opens on the first visit and from "Edit setup"; closes once a run succeeds. -->
    <dialog id="setup-dialog" class="bt-modal" aria-labelledby="setup-title">
        <form id="setup" class="card bt-setup">
            <div class="bt-setup-head">
                <h2 class="bt-setup-title" id="setup-title">Backtest setup</h2>
                <button type="button" class="bt-close" id="close-setup" aria-label="Close">&times;</button>
            </div>
            <div class="bt-setup-grid">
                <div class="bt-field">
                    <span class="label">Instrument</span>
                    <div class="search-box">
                        <input id="search" class="search-input" type="search" autocomplete="off" autofocus
                               placeholder="Search eg: reliance, nifty 50" aria-label="Search instruments" required>
                        <ul id="search-results" class="search-results" hidden></ul>
                    </div>
                </div>

                <div class="bt-field">
                    <span class="label">Strategy</span>
                    <!-- Custom dropdown (same <details> trick as the account menu): a native <select> opens an
                         OS-styled menu that ignores the theme. Options come from GET /api/strategies. -->
                    <details class="dropdown" id="strategy-dropdown">
                        <summary class="search-input dropdown-value" id="strategy-value">Loading…</summary>
                        <ul class="dropdown-list" id="strategies" role="listbox" aria-label="Strategy"></ul>
                    </details>
                </div>

                <p class="muted small bt-hint bt-span" id="strategy-hint"></p>

                <div class="bt-field">
                    <span class="label">Candles</span>
                    <div class="interval-group" id="intervals" role="group" aria-label="Candle interval">
                        <button type="button" class="interval" data-interval="minute">1m</button>
                        <button type="button" class="interval" data-interval="3minute">3m</button>
                        <button type="button" class="interval active" data-interval="5minute">5m</button>
                        <button type="button" class="interval" data-interval="15minute">15m</button>
                        <button type="button" class="interval" data-interval="30minute">30m</button>
                    </div>
                    <p class="muted small bt-hint" id="interval-hint" hidden></p>
                </div>

                <div class="bt-field">
                    <span class="label">Period</span>
                    <div class="interval-group" id="ranges" role="group" aria-label="Period">
                        <button type="button" class="interval" data-days="30">1M</button>
                        <button type="button" class="interval" data-days="60">2M</button>
                        <button type="button" class="interval active" data-days="90">3M</button>
                        <button type="button" class="interval" data-days="custom">Custom</button>
                    </div>
                    <div id="custom-range" class="bt-dates" hidden>
                        <input id="from" class="search-input" type="date" aria-label="From">
                        <span class="muted">to</span>
                        <input id="to" class="search-input" type="date" aria-label="To">
                    </div>
                    <p id="range-text" class="muted small bt-hint"></p>
                </div>
            </div>

            <div class="bt-setup-foot">
                <p id="form-error" class="bt-error" hidden></p>
                <button type="button" class="button-ghost bt-cancel" id="cancel-setup">Cancel</button>
                <button type="submit" class="button bt-run" id="run">Run backtest</button>
            </div>
        </form>
    </dialog>

    <!-- Before the first run -->
    <div id="empty" class="bt-empty">
        <p class="muted">No backtest yet</p>
        <button type="button" class="button" id="new-backtest">New backtest</button>
    </div>

    <div id="status" class="bt-status" hidden></div>

    <div id="content" hidden>
        <!-- What was run, in one line, with Edit setup / Run again -->
        <div class="bt-runbar">
            <div class="bt-runbar-info">
                <span id="chart-title" class="symbol"></span>
                <span id="run-meta" class="muted"></span>
            </div>
            <div class="bt-runbar-actions">
                <button type="button" class="button-ghost" id="toggle-setup">Edit setup</button>
                <button type="button" class="button" id="run-again">Run again</button>
            </div>
        </div>

        <!-- One view at a time: a run opens on Summary -->
        <div class="interval-group bt-tabs" id="tabs" role="tablist" aria-label="Result views">
            <button type="button" class="interval active" role="tab" data-tab="summary">Summary</button>
            <button type="button" class="interval" role="tab" data-tab="chart">Chart</button>
            <button type="button" class="interval" role="tab" data-tab="trades">
                Trades <span id="trades-count" class="bt-tab-count"></span>
            </button>
        </div>

        <div class="bt-panel" data-panel="summary">
            <div class="stat-grid" id="stats"></div>
        </div>

        <div class="bt-panel" data-panel="chart" hidden>
            <div class="chart-box bt-chart">
                <div id="chart"></div>
                <!-- Floats over the chart's top-left corner, like a trading terminal's legend -->
                <div id="chart-legend" class="chart-legend bt-legend"></div>
            </div>
        </div>

        <div class="bt-panel" data-panel="trades" hidden>
            <div class="bt-trades-toolbar">
                <div class="interval-group" id="trade-filters" role="group" aria-label="Filter trades">
                    <button type="button" class="interval active" data-filter="all">All</button>
                    <button type="button" class="interval" data-filter="winners">Winners</button>
                    <button type="button" class="interval" data-filter="losers">Losers</button>
                    <button type="button" class="interval" data-filter="long">Long</button>
                    <button type="button" class="interval" data-filter="short">Short</button>
                </div>
                <input id="trade-search" class="search-input bt-trade-search" type="search" autocomplete="off"
                       placeholder="Search trades" aria-label="Search trades">
                <button type="button" class="button-ghost bt-csv" id="trades-csv">Download CSV</button>
            </div>
            <p class="muted small bt-panel-note">
                <span id="trades-shown"></span> · points per share, before costs · click a row to see it on the chart
            </p>
            <div class="table-wrap bt-trades-wrap">
                <table class="bt-trades">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Date</th>
                        <th>Side</th>
                        <th>Entry</th>
                        <th>Exit</th>
                        <th>Reason</th>
                        <th class="num">P&amp;L</th>
                        <th class="num">%</th>
                        <th class="num">Chart</th>
                    </tr>
                    </thead>
                    <tbody id="trades-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="/js/common.js"></script>
<script src="/js/backtest.js"></script>
</body>
</html>
