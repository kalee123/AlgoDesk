<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · AlgoDesk</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme.js"></script>
</head>
<body data-page="dashboard">
<header id="app-nav" class="navbar"></header>

<main>
    <!-- No page title: the navbar already says where you are -->
    <div class="page-head">
        <span id="updated" class="muted small"></span>
    </div>

    <!-- Index strip: /api/market/indices, loads on its own so a failure here doesn't block the page -->
    <div id="indices" class="index-strip" aria-label="Market indices"></div>

    <div id="status" class="status">Loading…</div>
    <div id="content" hidden>
        <!-- KPI tiles + movers: /api/dashboard/summary.
             With 3 columns the 4th tile starts a second row; movers fills the rest of that row. -->
        <div class="grid kpis">
            <section class="card kpi" id="kpi-today"></section>
            <section class="card kpi" id="kpi-portfolio"></section>
            <section class="card kpi" id="kpi-margin"></section>
            <section class="card kpi" id="kpi-orders"></section>

            <section class="panel movers-panel">
                <div class="panel-head">
                    <h2>Today's movers</h2>
                    <a href="/holdings">All holdings</a>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>Instrument</th>
                            <th class="num">LTP</th>
                            <th class="num">Day chg.</th>
                            <th class="num">Day P&amp;L</th>
                        </tr>
                        </thead>
                        <tbody id="movers-body"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <div class="grid panels">
            <section class="panel">
                <div class="panel-head">
                    <h2>Recent orders</h2>
                    <a href="/orders">All orders</a>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>Time</th>
                            <th>Type</th>
                            <th>Instrument</th>
                            <th class="num">Qty</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody id="orders-body"></tbody>
                    </table>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>Open positions</h2>
                    <a href="/positions">All positions</a>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>Instrument</th>
                            <th>Product</th>
                            <th class="num">Qty</th>
                            <th class="num">LTP</th>
                            <th class="num">Today (M2M)</th>
                            <th class="num">P&amp;L</th>
                        </tr>
                        </thead>
                        <tbody id="positions-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
